category: "AI基础设施/AI安全"
description: "LLM模型安全扫描、漏洞检测、偏见审计与对抗测试，生产部署前合规检查"
commands:
- name: garak
  category: "AI基础设施/AI安全"
  install_required: true
  install_method: "pip install garak"
  description: "Garak LLM漏洞扫描框架，探测越狱、提示注入、数据泄露、幻觉等安全风险"
  usage:
  - "garak [OPTIONS]"
  options:
  - flag: "--model_type"
    description: "模型类型 (openai, huggingface, replicate)"
  - flag: "--model_name"
    description: "模型名称"
  - flag: "--probes"
    description: "探测插件列表"
  - flag: "--generations"
    description: "每探测生成次数"
  examples:
  - command: "garak --model_type openai --model_name gpt-4 --probes all"
    description: "全面扫描GPT-4安全风险"
  - command: "garak --model_type huggingface --model_name meta-llama/Llama-2-7b-chat-hf
      --probes encoding,dan,knownbadsignatures"
    description: "针对性检测已知攻击向量"
  platforms:
  - "linux"
  - "darwin"
  - "windows"
  related_commands:
  - "red-teaming"
  - "llm-guard"
  risks:
  - level: high
    description: "安全测试可能触发内容过滤器，需在隔离环境执行"
  - level: high
    description: 安全测试可能触发告警或访问敏感内容，请在授权和可监控环境下执行。
  references:
  - "https://github.com/leondz/garak"

- name: modelscan
  category: "AI基础设施/AI安全"
  install_required: true
  install_method: "pip install modelscan"
  description: "ProtectAI ModelScan模型文件安全扫描，检测Pickle反序列化漏洞、恶意代码注入"
  usage:
  - "modelscan [OPTIONS] PATH"
  options:
  - flag: "--path"
    description: "扫描路径"
  - flag: "--format"
    description: "输出格式 (json, table)"
  examples:
  - command: "modelscan /path/to/models/"
    description: "扫描模型目录"
  - command: "modelscan model.pkl --format json"
    description: "扫描单个Pickle文件并输出JSON"
  platforms:
  - "linux"
  - "darwin"
  - "windows"
  related_commands:
  - "safetensors-convert"
  - "garak"
  risks:
  - level: low
    description: "只读扫描不改变文件"
  references:
  - "https://github.com/protectai/modelscan"

- name: llm-guard
  category: "AI基础设施/AI安全"
  install_required: true
  install_method: "pip install llm-guard"
  description: "LLM Guard输入输出安全过滤器，检测PII泄露、毒性、越狱、提示注入"
  usage:
  - "python app.py (使用llm_guard库)"
  - "docker run [OPTIONS] laiyio/llm-guard-api"
  options:
  - flag: "input_scanners"
    description: "输入扫描器列表"
  - flag: "output_scanners"
    description: "输出扫描器列表"
  examples:
  - command: "docker run -p 8000:8000 laiyio/llm-guard-api:latest"
    description: "启动LLM Guard API服务"
  - command: "python -c \"from llm_guard import scan_prompt; result = scan_prompt('prompt',
      scanners=['Anonymize', 'PromptInjection'])\""
    description: "Python调用输入过滤"
  platforms:
  - "linux"
  - "darwin"
  - "windows"
  related_commands:
  - "garak"
  - "safety-eval"
  risks:
  - level: low
    description: "过滤器可能误判合法输入，需调优阈值"
  references:
  - "https://github.com/laiyer-ai/llm-guard"

- name: inspect-ai
  category: "AI基础设施/AI安全"
  install_required: true
  install_method: "pip install inspect-ai"
  description: "UK AISI Inspect AI评测框架，系统化评估模型知识、推理、安全性和能力"
  usage:
  - "inspect [COMMAND] [OPTIONS]"
  options:
  - flag: "eval"
    description: "运行评测"
  - flag: "view"
    description: "查看评测结果"
  - flag: "list"
    description: "列出任务"
  examples:
  - command: "inspect eval security_eval.py --model openai/gpt-4"
    description: "运行安全评测"
  - command: "inspect eval math_eval.py --model anthropic/claude-3-sonnet --epochs
      3"
    description: "数学能力多次评测"
  platforms:
  - "linux"
  - "darwin"
  - "windows"
  related_commands:
  - "lm-eval"
  - "safety-eval"
  risks:
  - level: low
    description: "评测框架安全"
  references:
  - "https://github.com/UKGovernmentBEIS/inspect_ai"

- name: neuralsecure
  category: "AI基础设施/AI安全"
  install_required: true
  install_method: "pip install neuralsecure"
  description: "NeuralSecure ML模型安全审计，检测对抗样本脆弱性、成员推断攻击、模型窃取风险"
  usage:
  - "python audit.py (使用neuralsecure库)"
  options:
  - flag: "adversarial_robustness"
    description: "对抗鲁棒性测试"
  - flag: "membership_inference"
    description: "成员推断攻击测试"
  - flag: "model_extraction"
    description: "模型提取攻击测试"
  examples:
  - command: "python audit.py --model ./model.pt --tests adversarial,membership,extraction
      --output report.json"
    description: "全面安全审计"
  - command: python audit.py --model ./model.pt --tests adversarial --output 
      report.json --verbose
    description: 只进行对抗样本审计
  platforms:
  - "linux"
  - "darwin"
  - "windows"
  related_commands:
  - "modelscan"
  - "garak"
  risks:
  - level: medium
    description: "攻击测试需在隔离环境执行"
  references:
  - "https://github.com/protectai/neuralsecure"

- name: pyrit
  category: "AI基础设施/AI安全"
  install_required: true
  install_method: "pip install pyrit"
  description: "PyRIT (微软开源) 生成式AI红队自动化框架，编排多轮攻击、评分与风险证据收集"
  usage:
  - "python redteam.py (使用pyrit库)"
  options:
  - flag: "PromptSendingOrchestrator"
    description: "批量发送攻击prompt的编排器"
  - flag: "RedTeamingOrchestrator"
    description: "多轮自适应红队对话"
  - flag: "SelfAskTrueFalseScorer"
    description: "基于LLM的攻击成功与否评分器"
  examples:
  - command: "python -c \"from pyrit.orchestrator import RedTeamingOrchestrator; ...\""
    description: "启动多轮自适应红队攻击目标模型"
  - command: "python -c \"from pyrit.orchestrator import PromptSendingOrchestrator; orch.send_prompts_async(prompts)\""
    description: "批量发送攻击prompt并收集结果"
  platforms:
  - "linux"
  - "darwin"
  - "windows"
  related_commands:
  - "garak"
  - "rebuff"
  risks:
  - level: high
    description: "生成真实攻击载荷，仅限授权红队测试，禁止用于未授权系统"
  - level: medium
    description: "攻击编排器会调用目标LLM API产生费用，大规模红队测试前应设置速率与调用上限"
  references:
  - "https://github.com/Azure/PyRIT"

- name: rebuff
  category: "AI基础设施/AI安全"
  install_required: true
  install_method: "pip install rebuff"
  description: "Rebuff 提示注入检测库，多层防御（启发式+LLM+向量库+金丝雀）拦截恶意prompt"
  usage:
  - "python guard.py (使用rebuff库)"
  options:
  - flag: "detect_injection"
    description: "检测输入是否包含注入攻击"
  - flag: "add_canary_word"
    description: "注入金丝雀词检测提示泄露"
  examples:
  - command: "python -c \"from rebuff import Rebuff; rb = Rebuff(api_token='...'); result = rb.detect_injection('ignore previous instructions')\""
    description: "检测典型越狱提示"
  - command: "python -c \"from rebuff import Rebuff; rb = Rebuff(api_token='...'); buffed = rb.add_canary_word(prompt); # 在输出中检测金丝雀词是否泄露\""
    description: "使用金丝雀词机制检测提示泄露"
  platforms:
  - "linux"
  - "darwin"
  - "windows"
  related_commands:
  - "llm-guard"
  - "garak"
  risks:
  - level: low
    description: "检测为概率性，不能作为唯一防线，需与输出过滤配合"
  references:
  - "https://github.com/protectai/rebuff"

- name: nemo-guardrails
  category: "AI基础设施/AI安全"
  install_required: true
  install_method: "pip install nemoguardrails"
  description: "NVIDIA NeMo Guardrails 可编程护栏框架，用Colang定义对话边界、事实性与安全策略"
  usage:
  - "nemoguardrails [COMMAND] [OPTIONS]"
  options:
  - flag: "chat"
    description: "启动带护栏的交互式对话"
  - flag: "server"
    description: "启动护栏API服务端"
  - flag: "--config"
    description: "指定护栏配置目录 (rails + Colang)"
  examples:
  - command: "nemoguardrails server --config ./config"
    description: "基于配置目录启动护栏服务"
  - command: "nemoguardrails chat --config ./config"
    description: "本地测试护栏拦截效果"
  platforms:
  - "linux"
  - "darwin"
  related_commands:
  - "llm-guard"
  - "rebuff"
  risks:
  - level: medium
    description: "Colang规则误配可能过度拦截正常请求或放行恶意输入"
  references:
  - "https://github.com/NVIDIA/NeMo-Guardrails"
